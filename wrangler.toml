name = "email-webhook-spike"
main = "src/index.ts"
compatibility_date = "2025-09-01"


[[kv_namespaces]]
binding = "INBOX_STATE"
id = "5a936f0100db491ea09910443abb564c"

# 0 14 * * *  — renew Gmail users.watch (~7 day expiry), 14:00 UTC / 07:00 PT
# 20 */4 * * * — reconcile: catch-up history drain for all mailboxes
[triggers]
crons = ["0 14 * * *", "20 */4 * * *"]

# Classifier: OpenRouter Decisions + TypeSafe Jev (~typesafe/jev-latest).
[vars]
# Set OWNER_EMAIL / WORK_EMAIL via `wrangler secret put` (or dashboard) per deploy.
# Do not commit real addresses.
CLASSIFIER_MODEL = "~typesafe/jev-latest"

# Secrets:
#   OPENROUTER_API_KEY — required for LLM classify (https://openrouter.ai/keys)
#   GROK_WEBHOOK_URL, GROK_WEBHOOK_KEY
#   GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, GMAIL_REFRESH_TOKEN (optional legacy)
#   GMAIL_PUBSUB_TOPIC (projects/ID/topics/NAME)
#   PUBLIC_PUSH_URL (https://…/pubsub) — OIDC audience
# Optional: OWNER_EMAIL, WORK_EMAIL, ALLOW_INSECURE_PUSH=1, ALLOW_DEBUG=1
# Optional Gofobo screening pass forwarding:
#   MOVIES_WEBHOOK_URL — endpoint to POST Gofobo emails (personal mailbox only)
#   MOVIES_WEBHOOK_AUTH — bearer token for movies webhook
# CLASSIFIER_MODEL is set above; override via secret if desired.
